[package]
name = "rhema-stt"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json", "stream"], optional = true }
url = "2"
futures-util = "0.3"
crossbeam-channel = "0.5"
async-trait = "0.1"

# Whisper local STT (optional)
rhema-audio = { path = "../audio", optional = true }

# NVIDIA Parakeet local STT (optional), through sherpa-onnx. Uses the
# prebuilt shared sherpa-onnx + onnxruntime libraries downloaded at build
# time. Static linking failed: on Windows the static libraries use a
# different C runtime (duplicate std:: symbols at link time), and on Linux
# Whisper crashed when both C++ engines were linked into one binary.
sherpa-onnx = { version = "=2.0.1", optional = true, default-features = false, features = ["shared"] }

# Bodhan AI Indic-Transcribe (Malayalam), through onnxruntime. The same
# ort as the detection crate's embeddings, so the app carries one copy.
ort = { version = "2.0.0-rc.12", optional = true }
# Bible book names, to steer Indic-Transcribe toward them.
chorus-refparse = { path = "../chorus-refparse", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"], optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", optional = true }

[features]
default = ["rest-fallback"]
rest-fallback = ["reqwest"]
whisper = ["dep:whisper-rs", "rhema-audio"]
# NVIDIA Parakeet (English, CPU). Shares Whisper's speech detection code.
parakeet = ["whisper", "dep:sherpa-onnx"]
# Bodhan AI Indic-Transcribe for Malayalam (CPU, int8).
indic-transcribe = ["whisper", "dep:ort", "dep:chorus-refparse"]
# Run Whisper on an NVIDIA graphics card (needs the CUDA Toolkit to build).
cuda = ["whisper", "whisper-rs/cuda"]
# Run Whisper on any Vulkan graphics card: NVIDIA, AMD or Intel
# (needs the Vulkan SDK to build).
vulkan = ["whisper", "whisper-rs/vulkan"]

[[example]]
name = "whisper_bench"
required-features = ["whisper"]

[[example]]
name = "whisper_lines"
required-features = ["whisper"]

[[example]]
name = "parakeet_lines"
required-features = ["parakeet"]

[[example]]
name = "indic_transcribe_lines"
required-features = ["indic-transcribe"]
