name: Chorus Windows build

# The owner runs Chorus on Windows. Builds the speech crate with Whisper and
# Parakeet on a Windows machine (MSVC), and runs Parakeet on a clip to prove
# the downloaded sherpa-onnx / onnxruntime libraries link and work there.

on:
  push:
    branches: ["chorus/**"]
    paths:
      - "src-tauri/crates/stt/**"
      - "src-tauri/crates/replay/**"
      - "data/test-sermon.ts"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/chorus-windows.yml"
  workflow_dispatch:

concurrency:
  group: chorus-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-stt

      - name: Fresh sherpa-onnx download (cached builds can lose its libraries)
        shell: bash
        run: rm -rf src-tauri/target/sherpa-onnx-prebuilt src-tauri/target/*/build/sherpa-onnx-sys-*

      - name: Build speech crate with Parakeet (release)
        working-directory: src-tauri
        shell: bash
        run: cargo build --release --locked -p rhema-stt --features parakeet --example parakeet_lines

      - name: Where the sherpa-onnx DLLs were put
        shell: bash
        run: find src-tauri/target/release -maxdepth 3 -iname '*.dll' | grep -iv "/deps/build" | head -20

      - name: Download Parakeet model and a test clip
        shell: bash
        run: |
          mkdir -p models/parakeet
          curl -L --fail --retry 3 -o pk.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8.tar.bz2
          tar -xjf pk.tar.bz2 -C models/parakeet
          ls models/parakeet/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
          ls models/parakeet/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8/test_wavs || true

      - name: Run Parakeet on Windows
        shell: bash
        run: |
          d=models/parakeet/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
          clip=$(ls $d/test_wavs/*.wav | head -1)
          src-tauri/target/release/examples/parakeet_lines.exe $d 4 "$clip" | tee out.txt
          test -s out.txt

      # Indic-Transcribe (Malayalam) uses its own onnxruntime (the ort crate,
      # 1.28) next to the onnxruntime.dll sherpa-onnx ships (also 1.28).
      # Build and run it here to prove both live together on Windows.
      - name: Build Indic-Transcribe (Malayalam) example
        working-directory: src-tauri
        shell: bash
        run: cargo build --release --locked -p rhema-stt --features parakeet,indic-transcribe --example indic_transcribe_lines
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download Indic-Transcribe model
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --quiet huggingface_hub
          python - <<'PY'
          import os, shutil, tarfile
          from huggingface_hub import hf_hub_download
          tar = hf_hub_download("Mvkd2k06/indic-transcribe-core-onnx", "variants/int8/indic-transcribe-core-int8.tar")
          with tarfile.open(tar) as t:
              t.extractall("it-x", filter="data")
          os.makedirs("it-model", exist_ok=True)
          for d, _, files in os.walk("it-x"):
              for f in files:
                  shutil.move(os.path.join(d, f), os.path.join("it-model", f))
          print(os.listdir("it-model"))
          PY
      - name: Run Indic-Transcribe on Windows
        shell: bash
        run: |
          d=models/parakeet/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
          clip=$(ls $d/test_wavs/*.wav | head -1)
          src-tauri/target/release/examples/indic_transcribe_lines.exe it-model 4 "$clip" | tee it.txt
          test -s it.txt

      # The sermon test (bun run test:sermon) on Windows: real pipeline,
      # Indic-Transcribe, audio file in, verse list out.
      - uses: oven-sh/setup-bun@v2
      - name: Sermon test command on Windows
        shell: bash
        run: |
          mkdir -p models/malayalam
          mv it-model models/malayalam/indic-transcribe-core-int8
          d=models/parakeet/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
          clip=$(ls $d/test_wavs/*.wav | head -1)
          bun run test:sermon "$clip" --minutes 1
          cat test-audio/report-new.txt
          grep -q "VERSES SHOWN" test-audio/report-new.txt
          ! grep -q "ENGINE ERROR" test-audio/report-new.txt
