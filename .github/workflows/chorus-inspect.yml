name: Chorus inspect dependency API

# Prints parts of dependency source code into the log, for development.
on:
  push:
    branches: ["chorus/**"]
    paths: [".github/workflows/chorus-inspect.yml"]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch crates and show any lock file change Cargo wants
        working-directory: src-tauri
        run: |
          cargo fetch
          echo "==== LOCKDIFF START"
          git diff --no-color Cargo.lock
          echo "==== LOCKDIFF END"
      - name: whisper-rs VAD API
        run: |
          d=$(ls -d ~/.cargo/registry/src/*/whisper-rs-0.16* | head -1)
          echo "== $d"; ls "$d/src"
          for f in "$d"/src/vad*.rs "$d"/src/whisper_vad*.rs; do [ -f "$f" ] && { echo "==== $f"; grep -nE "pub (fn|struct|enum)|impl " "$f"; }; done
          echo "==== FullParams vad"; grep -rnE "fn (set_)?vad|enable_vad|vad_model" "$d/src" | head -30
          s=$(ls -d ~/.cargo/registry/src/*/whisper-rs-sys-0.15* | head -1)
          echo "==== whisper.cpp vad params (C)"; grep -nA30 "struct whisper_vad_params {" "$s"/whisper.cpp/include/whisper.h | head -40

      - name: Rust crates for Parakeet / sherpa-onnx
        continue-on-error: true
        run: |
          cargo search sherpa --limit 20
          cargo search parakeet --limit 20
          cargo search "onnx asr" --limit 10

      - name: Parakeet-capable crate sources
        continue-on-error: true
        run: |
          mkdir -p /tmp/cr && cd /tmp/cr
          for c in sherpa-rs/0.6.8 sherpa-rs-sys/0.6.8 sherpa-onnx/2.0.1 sherpa-onnx-sys/2.0.1 parakeet-rs/0.4.4; do
            n=${c%/*}; v=${c#*/}
            curl -sL "https://static.crates.io/crates/$n/$n-$v.crate" | tar xz
          done
          for d in */; do
            echo "==== CRATE $d"; cat "$d/Cargo.toml" | sed -n '/^\[package\]/,/^\[lib\]/p;/^\[dependencies/,$p' | head -80
            find "$d" -name "*.rs" | head -40
          done
          echo "==== sherpa-rs transducer"; cat sherpa-rs-0.6.8/src/transducer.rs 2>/dev/null | head -150
          echo "==== sherpa-rs-sys build.rs"; head -120 sherpa-rs-sys-0.6.8/build.rs
          echo "==== sherpa-onnx lib"; grep -rn "pub fn\|pub struct" sherpa-onnx-2.0.1/src | grep -i "offline\|transducer\|recogn" | head -60
          echo "==== sherpa-onnx-sys build.rs"; head -120 sherpa-onnx-sys-2.0.1/build.rs
          echo "==== parakeet-rs lib"; grep -rn "pub fn\|pub struct" parakeet-rs-0.4.4/src | head -60
          sed -n '1,80p' parakeet-rs-0.4.4/README.md

      - name: sherpa-onnx offline ASR API (full)
        continue-on-error: true
        run: |
          cd /tmp/cr
          sed -n '1,120p;440,800p' sherpa-onnx-2.0.1/src/offline_asr.rs
          echo "==== sys build.rs archive names"; grep -n "archive\|windows\|msvc\|static\|\.tar" sherpa-onnx-sys-2.0.1/build.rs | sed -n '1,120p'
          echo "==== README"; sed -n '1,120p' sherpa-onnx-2.0.1/README.md
