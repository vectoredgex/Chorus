name: Chorus Malayalam engines

# Compares Malayalam speech engines on a spoken test sermon full of Bible
# references (book names, chapter and verse numbers in Malayalam):
#   IndicConformer 600M (AI4Bharat, sherpa-onnx int8) - the front-runner
#   a second IndicConformer export, Malayalam-tuned Whisper medium, and
#   Whisper large-v3-turbo (what Chorus ships for English today).
# Three MMS voices (as is, deeper, higher), each clear,
# noisy, in an echoey hall, and spoken fast.
# CPU only. Models come from Hugging Face, which only CI can reach.

on:
  push:
    branches: ["chorus/**"]
    paths:
      - "scripts/chorus/ml_*.py"
      - "src-tauri/crates/chorus-refparse/**"
      - "src-tauri/crates/stt/src/indic_transcribe.rs"
      - "src-tauri/crates/stt/examples/indic_transcribe_lines.rs"
      - ".github/workflows/chorus-ml-engines.yml"
  workflow_dispatch:

concurrency:
  group: chorus-ml-engines-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  audio:
    name: Speak sermon (${{ matrix.voice }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        voice: [natural, deep, high]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 espeak-ng ffmpeg
          pip install --quiet soundfile numpy
          case "${{ matrix.voice }}" in
            natural|deep|high) pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
                     pip install --quiet transformers ;;
            anjali|harish)
                     # torchaudio must be the CPU build too, or it looks for CUDA.
                     pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
                     pip install --quiet git+https://github.com/huggingface/parler-tts.git
                     python3 -c "import torch, torchaudio; print(torch.__version__, torchaudio.__version__)" ;;
          esac
      - name: Speak
        run: python3 scripts/chorus/ml_sermon.py clips ${{ matrix.voice }}
      - uses: actions/upload-artifact@v4
        with:
          name: clips-${{ matrix.voice }}
          path: clips/*.wav

  transcribe:
    name: ${{ matrix.engine }} (${{ matrix.voice }})
    needs: audio
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Whisper (medium-ml, large-v3-turbo) was dropped after taking over
        # 20 minutes for 42 short clips on CI CPUs; IndicConformer took 0.4 s
        # per line. Run them again with workflow_dispatch if ever needed.
        # koyal, indicconformer-rnnt and indic-transcribe are gated: they need the HF_TOKEN
        # repo secret. indicconformer-rnnt and the full indic-transcribe were
        # measured in run 42482276437 and are left out to save time.
        # indic-transcribe-rust is the app's own Rust code (the same model as
        # indic-transcribe-int8, which is the Python reference for it).
        engine: [indicconformer, indic-transcribe-int8, indic-transcribe-rust]
        voice: [natural, deep, high]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: clips-${{ matrix.voice }}
          path: clips
      - name: Install
        run: |
          pip install --quiet soundfile numpy huggingface_hub
          case "${{ matrix.engine }}" in
            indicconformer-rnnt|indicconformer-ctc)
               pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
               pip install --quiet transformers "onnxruntime<1.23" ;;
            indic-transcribe-int8) pip install --quiet "onnxruntime>=1.24" ;;
            indic-transcribe-rust) ;;
            indicconformer*|omnilingual*) pip install --quiet sherpa-onnx ;;
            koyal) pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
               pip install --quiet "nemo_toolkit[asr]" ;;
            indic-transcribe) pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
               pip install --quiet transformers sentencepiece accelerate ;;
            *) pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
               pip install --quiet transformers ;;
          esac
      - name: Cache model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/omnilingual
          key: ml-engines-hf-${{ matrix.engine }}-v1
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.engine == 'indic-transcribe-rust'
      - uses: Swatinem/rust-cache@v2
        if: matrix.engine == 'indic-transcribe-rust'
        with:
          workspaces: src-tauri
          key: ml-it-rust
      - name: Build the app's Indic-Transcribe code and fetch its model
        if: matrix.engine == 'indic-transcribe-rust'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          (cd src-tauri && cargo build --release --locked -p rhema-stt --features indic-transcribe --example indic_transcribe_lines)
          python3 - <<'PY'
          import os, shutil, tarfile
          from huggingface_hub import hf_hub_download
          tar = hf_hub_download("Mvkd2k06/indic-transcribe-core-onnx", "variants/int8/indic-transcribe-core-int8.tar")
          with tarfile.open(tar) as t:
              print("\n".join(m.name for m in t.getmembers()))
              t.extractall("it-x", filter="data")
          os.makedirs("it-model", exist_ok=True)
          for d, _, files in os.walk("it-x"):
              for f in files:
                  shutil.move(os.path.join(d, f), os.path.join("it-model", f))
          print(os.listdir("it-model"))
          PY
      - name: Transcribe
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p out
          E=${{ matrix.engine }}; V=${{ matrix.voice }}; T=$(nproc)
          case "$E" in koyal|indicconformer-rnnt|indicconformer-ctc|indic-transcribe)
            if [ -z "$HF_TOKEN" ]; then echo "::warning::$E skipped: add the HF_TOKEN repo secret"; exit 0; fi ;;
          esac
          run() {
            if [ "$E" = indic-transcribe-rust ]; then
              src-tauri/target/release/examples/indic_transcribe_lines it-model $T "$@"
            else
              python3 scripts/chorus/ml_transcribe.py $E $T "$@"
            fi
          }
          run $(ls clips/line??.wav) > out/${E}_${V}_clear.tsv
          for c in noisy hall fast; do
            run $(ls clips/line??_$c.wav) > out/${E}_${V}_$c.tsv
          done
          cat out/*.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: text-${{ matrix.engine }}-${{ matrix.voice }}
          path: out/*.tsv

  score:
    name: Score
    needs: transcribe
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: text-*
          path: out
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Find references in each transcript
        working-directory: src-tauri
        run: |
          cargo build --release -q -p chorus-refparse --example detect_tsv
          for f in ../out/*.tsv; do
            target/release/examples/detect_tsv "$f" > "${f%.tsv}.refs"
          done
      - name: Score
        run: |
          ls out
          python3 scripts/chorus/ml_score.py $(ls out/*.tsv | sort) | tee score.txt
          { echo '```'; cat score.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
